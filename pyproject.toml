[project]
name = "safco-agent-poc"
version = "0.1.0"
description = "Agent-based POC for Safco Dental product catalog extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "playwright>=1.45",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
safco-agent = "safco_agent.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

